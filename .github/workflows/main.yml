name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config into index.html
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import pathlib

          path = pathlib.Path("index.html")
          html = path.read_text(encoding="utf-8")

          fb_json = os.environ.get("FIREBASE_CONFIG_JSON", "")

          # Fail the build loudly if the secret isn't valid JSON, rather than
          # silently shipping a broken page.
          if fb_json:
              json.loads(fb_json)

          fb_placeholder = "'__FIREBASE_CONFIG_PLACEHOLDER__'"

          count = html.count(fb_placeholder)
          if count == 0:
              raise SystemExit("Firebase config placeholder not found in index.html — did the file change?")
          if count > 1:
              raise SystemExit(
                  f"Firebase config placeholder appears {count} times — it must appear "
                  "exactly once, or this replace will corrupt any other copy (e.g. a "
                  "sentinel check comparing against it)."
              )

          html = html.replace(fb_placeholder, json.dumps(fb_json))

          path.write_text(html, encoding="utf-8")
          print("Secret injected.")
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
